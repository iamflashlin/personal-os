[project]
name = "personal-os"
version = "0.0.0"
description = "Personal AI operating and execution system"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
# Windows-only: real GUI verification (pywinauto UIA backend + screenshots).
desktop = [
    "pillow>=13.0.0 ; sys_platform == 'win32'",
    "pywinauto>=0.6.9 ; sys_platform == 'win32'",
]

[tool.uv]
default-groups = ["dev", "desktop"]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", ".evidence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
include = ["tools", "scripts", "tests", "apps", "packages"]
exclude = ["**/node_modules", "**/.venv", ".evidence"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["tools"]
